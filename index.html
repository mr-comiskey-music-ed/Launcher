  function populateSelect(selectElem, docs, defaultText) {
    selectElem.innerHTML = `<option value="">${defaultText}</option>`;
    docs.forEach(doc => {
      const opt = document.createElement('option');
      opt.value = doc.webViewLink || `https://docs.google.com/document/d/${doc.id}/view`;
      opt.textContent = doc.title;
      selectElem.appendChild(opt);
    });
  }

  // Fetch Dynamic Folder Contents
  async function loadDriveDocs() {
    try {
      const res = await fetch('/api/get-docs');
      if (!res.ok) throw new Error('API fetch error');
      const data = await res.json();
      
      populateSelect(seSelect, data.se || FALLBACK_SE, '-- Choose Sound Engineering Project --');
      populateSelect(ampSelect, data.amp || FALLBACK_AMP, '-- Choose AMP Project --');
    } catch (e) {
      console.warn('Dynamic Drive fetch failed, using fallback lists.', e);
      populateSelect(seSelect, FALLBACK_SE, '-- Choose Sound Engineering Project --');
      populateSelect(ampSelect, FALLBACK_AMP, '-- Choose AMP Project --');
    }
  }

  loadDriveDocs();

  // Populate docInput when dropdown selected, clear mutual dropdown
  seSelect.addEventListener('change', () => { 
    if(seSelect.value) { 
      ampSelect.value = ''; 
      docInput.value = seSelect.value; 
    } else {
      docInput.value = '';
    }
  });
  ampSelect.addEventListener('change', () => { 
    if(ampSelect.value) { 
      seSelect.value = ''; 
      docInput.value = ampSelect.value; 
    } else {
      docInput.value = '';
    }
  });
  docInput.addEventListener('input', () => { 
    if(docInput.value) { 
      seSelect.value = ''; 
      ampSelect.value = ''; 
    } 
  });

  // Shortcuts Data

  async function launchFloater(selectedDocId) {
    let iframeSrc = '';
    let directUrl = '';
    let docId = '';

    if (selectedDocId.startsWith('http://') || selectedDocId.startsWith('https://')) {
      directUrl = selectedDocId;
      const match = selectedDocId.match(/\/d\/(e\/[a-zA-Z0-9-_]+|[a-zA-Z0-9-_]+)/);
      if (match && match[1]) docId = match[1];

      if (selectedDocId.includes('drive.google.com/file/d/')) {
        iframeSrc = selectedDocId.replace(/\/view.*$/, '/preview').replace(/\/edit.*$/, '/preview');
        if (!iframeSrc.includes('/preview')) iframeSrc += '/preview';
      } else if (selectedDocId.includes('docs.google.com/document/d/')) {
        iframeSrc = selectedDocId.replace(/\/view.*$/, '/preview?rm=minimal&authuser=0').replace(/\/edit.*$/, '/preview?rm=minimal&authuser=0');
      } else {
        iframeSrc = selectedDocId;
      }
    } else {
      docId = selectedDocId.replace(/[\/%\s]+$/, '');
      const match = docId.match(/\/d\/(e\/[a-zA-Z0-9-_]+|[a-zA-Z0-9-_]+)/);
      if (match && match[1]) docId = match[1];

      iframeSrc = docId.startsWith('e/')
        ? `https://docs.google.com/document/d/${docId}/pub?embedded=true`
        : `https://docs.google.com/document/d/${docId}/preview?rm=minimal&authuser=0`;
      
      directUrl = docId.startsWith('e/')
        ? `https://docs.google.com/document/d/${docId}/pub`
        : `https://docs.google.com/document/d/${docId}/view`;
    }

    try {
      const pipWindow = await window.documentPictureInPicture.requestWindow({
        width: 640,
        height: 820,
      });

      const fontLink = pipWindow.document.createElement('link');
      fontLink.rel = 'stylesheet';
      fontLink.href = 'https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap';
      pipWindow.document.head.appendChild(fontLink);

      const markedScript = pipWindow.document.createElement('script');
      markedScript.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
      pipWindow.document.head.appendChild(markedScript);

      const style = pipWindow.document.createElement('style');

        .toolbar button.patterns-btn { background: #065F46; border-color: #34D399; color: #ECFDF5; }
        .toolbar button.glossary-btn { background: #0284c7; border-color: #38bdf8; color: #f0f9ff; }
        .toolbar button.checklist-btn { background: #000000; border-color: #ffffff; color: #ffffff; }

          overflow: hidden; z-index: 50; background: #ffffff;

      let cachedPatterns = EMBEDDED_PATTERNS;

      function writeVarLength(value) {
        const buffer = [];
        let v = value & 0x7F;
        while ((value >>= 7) > 0) {
          buffer.unshift((value & 0x7F) | 0x80);
        }
        buffer.push(v);
        return buffer;
      }

      function generatePatternMidiDataUri(pat) {
        const ticksPerBeat = 480;
        const stepsPerBeat = pat.stepsPerBeat || 4;
        const ticksPerStep = Math.round(ticksPerBeat / stepsPerBeat);
        const bpm = (pat.meta && pat.meta.bpmRange && pat.meta.bpmRange[0]) ? pat.meta.bpmRange[0] : 120;
        const usPerQuarter = Math.round(60000000 / bpm);

        const DRUM_MAP = {
          kick: 36,     // C1
          snare: 38,    // D1
          hihatC: 42,   // F#1
          hihatO: 46    // A#1
        };

        const events = [];
        const voices = pat.voices || {};

        for (const [voiceKey, noteNumber] of Object.entries(DRUM_MAP)) {
          const activeSteps = voices[voiceKey] || [];
          for (const step of activeSteps) {
            const startTime = step * ticksPerStep;
            const dur = voiceKey === 'hihatO' ? ticksPerStep * 2 : Math.max(1, ticksPerStep - 10);
            events.push({ time: startTime, type: 'on', note: noteNumber, vel: 100 });
            events.push({ time: startTime + dur, type: 'off', note: noteNumber, vel: 0 });
          }
        }

        events.sort((a, b) => a.time === b.time ? (a.type === 'off' ? -1 : 1) : a.time - b.time);

        const trackBytes = [];
        const nameStr = pat.name || 'Drum Pattern';
        const nameBytes = [];
        for (let i = 0; i < nameStr.length; i++) nameBytes.push(nameStr.charCodeAt(i));
        trackBytes.push(0x00, 0xFF, 0x03, nameBytes.length, ...nameBytes);
        trackBytes.push(0x00, 0xFF, 0x51, 0x03, (usPerQuarter >> 16) & 0xFF, (usPerQuarter >> 8) & 0xFF, usPerQuarter & 0xFF);
        trackBytes.push(0x00, 0xFF, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08);

        let lastTime = 0;
        for (const ev of events) {
          const deltaTime = ev.time - lastTime;
          lastTime = ev.time;
          trackBytes.push(...writeVarLength(deltaTime));
          if (ev.type === 'on') {
            trackBytes.push(0x99, ev.note, ev.vel);
          } else {
            trackBytes.push(0x89, ev.note, 0);
          }
        }

        trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

        const header = [
          0x4D, 0x54, 0x68, 0x64,
          0x00, 0x00, 0x00, 0x06,
          0x00, 0x00,
          0x00, 0x01,
          (ticksPerBeat >> 8) & 0xFF, ticksPerBeat & 0xFF
        ];

        const trackLen = trackBytes.length;
        const trackHeader = [
          0x4D, 0x54, 0x72, 0x6B,
          (trackLen >> 24) & 0xFF,
          (trackLen >> 16) & 0xFF,
          (trackLen >> 8) & 0xFF,
          trackLen & 0xFF
        ];

        const midiData = new Uint8Array([...header, ...trackHeader, ...trackBytes]);
        let binaryStr = '';
        for (let i = 0; i < midiData.length; i++) {
          binaryStr += String.fromCharCode(midiData[i]);
        }
        return `data:audio/midi;base64,${btoa(binaryStr)}`;
      }

              currentAudioCtx = new AudioContextClass();

                await currentAudioCtx.resume();

              currentSynth = new DrumSynth(currentAudioCtx);

              const bpm = (pat.meta && pat.meta.bpmRange && pat.meta.bpmRange[0]) ? pat.meta.bpmRange[0] : 120;
              const stepTime = (60 / bpm) / 4;
              const totalSteps = (pat.stepsPerBeat || 4) * (pat.beats || 4) * (pat.bars || 1);

        let taps = [];
        const bpmVal = pipWindow.document.getElementById('bpmVal');
        const delayTable = pipWindow.document.getElementById('delayTable');

        const updateDelays = (bpm) => {
          const quarterMs = Math.round((60000 / bpm));
          const eighthMs = Math.round(quarterMs / 2);
          const sixteenthMs = Math.round(quarterMs / 4);
          const dottedEighthMs = Math.round(eighthMs * 1.5);

          delayTable.innerHTML = `
            <div class="shortcut-row"><span>1/4 Note Delay:</span><span class="shortcut-key">${quarterMs} ms</span></div>
            <div class="shortcut-row"><span>1/8 Note Delay:</span><span class="shortcut-key">${eighthMs} ms</span></div>
            <div class="shortcut-row"><span>1/8 Dotted Delay:</span><span class="shortcut-key">${dottedEighthMs} ms</span></div>

        };

        updateDelays(120);

        pipWindow.document.getElementById('tapPad').addEventListener('click', () => {
          const now = Date.now();
          taps.push(now);
          if (taps.length > 4) taps.shift();
          if (taps.length > 1) {
            const diffs = [];
            for (let i = 1; i < taps.length; i++) diffs.push(taps[i] - taps[i-1]);
            const avgMs = diffs.reduce((a, b) => a + b) / diffs.length;
            const bpm = Math.round(60000 / avgMs);
            bpmVal.textContent = `${bpm} BPM`;
            updateDelays(bpm);
          }
        });

    "808": "A deep, long-decay sub-bass sound originally generated by the Roland TR-808 drum machine, now serving as the foundational bass/kick hybrid in modern hip-hop, trap, and pop.",

    "Additive Synthesis": "A method of audio synthesis that builds complex timbres by summing together individual sine waves at different frequencies, amplitudes, and phase relationships.",
    "ADSR Envelope": "The four stages of a sound's life cycle when triggered: Attack (speed to peak), Decay (drop to sustain level), Sustain (held level), and Release (fade out speed after key release).",
    "Aliasing": "Digital distortion caused when high frequencies exceed half the sample rate (the Nyquist limit) and fold back into lower, audible frequencies as harsh, unwanted metallic noise.",
    "All-Pass Filter": "A filter that lets all frequencies through at equal amplitude but alters the phase relationship across frequencies; heavily used in diffusers, phasers, and spatial processors.",
    "Amp Envelope": "An ADSR envelope hard-wired to control a synthesizer's Voltage Controlled Amplifier (VCA), determining how a sound's volume evolves over time.",
    "Artifacts": "Unwanted digital noises, clicks, pops, or unnatural phase smearing caused by aggressive audio processing, heavy compression, time-stretching, or low-bitrate encoding.",
    "ASIO / Core Audio": "Low-latency audio driver protocols. Core Audio is native to macOS; ASIO (Audio Stream Input/Output) is standard for professional audio interfaces on Windows.",
    "Audio File Editor": "A sample-accurate editor in Logic Pro used for non-destructive or destructive editing directly on recorded audio waveform files.",
    "Audio Track Editor": "A workspace showing the detailed region view of an audio track, used for Flex Pitch, Flex Time, and transient editing.",
    "Atmos (Dolby Atmos)": "An object-based surround sound format that allows audio engineers to place and move individual sounds in a three-dimensional sphere around the listener.",
    "Attenuation": "The act of reducing the volume level or amplitude of an audio signal.",
    "Audio Restoration": "The practice of removing unwanted acoustic or digital imperfections (clicks, pops, vinyl crackle, room hum, clipping) using spectral editing software.",
    "Band-Pass Filter": "A filter that allows a specific frequency band to pass through while attenuating frequencies above and below that range.",
    "Band-Stop Filter (Notch)": "A filter that cuts a very narrow band of frequencies while passing all frequencies above and below it; useful for removing surgical resonances or AC hum.",
    "Bandwidth (Q Factor)": "The range of frequencies affected by an equalizer band. A high Q value affects a narrow slice of frequencies; a low Q value affects a wide range.",
    "Bitcrusher": "A lo-fi effect that reduces the bit depth and sample rate of digital audio to introduce harsh, crunchy quantized digital distortion and retro video game textures.",
    "Buss Compression": "Applying a compressor across a sub-mix channel (e.g., drum bus, vocal bus, or master bus) to bind separate tracks together into a cohesive sonic unit ('glue').",
    "Bussing": "Routing audio signals from one or more channel strips along a virtual signal pathway (a Bus) to an Auxiliary channel or main output.",
    "Clip / Region": "A discrete block of recorded audio or MIDI data visible on a timeline within a DAW.",
    "Clipper / Soft Clipping": "A wave-shaping effect that chops off waveform peaks exceeding 0 dBFS. Soft clipping gradually rounds off the peaks, generating pleasing analog-style tape harmonics.",
    "Comb Filtering": "An acoustic or digital phase anomaly caused when a signal is mixed with a slightly delayed version of itself (1 to 15 ms), creating sharp, comb-like notches in the frequency response.",
    "Control Voltage (CV)": "An analog method of transmitting pitch, gate, and parameter instructions between modular synth hardware using electrical voltage rather than digital signals.",
    "Convolution Reverb": "A digital reverb processor that uses sampled Impulse Responses (IRs) captured from real physical spaces or hardware units to mathematically recreate their exact acoustic reflections.",
    "Crossover": "An electronic filter unit that divides an audio signal into separate frequency bands (e.g., splitting sub frequencies for subwoofers and high frequencies for tweeters).",
    "Detuning / Unison": "Stacking multiple active synth oscillators slightly out of pitch tune with each other to create a thick, wide, stereophonic chorus-like timbre.",
    "Direct Input (DI) / DI Box": "A device used to connect high-impedance instrument signals (like electric guitar or bass) directly into a low-impedance microphone preamp without using an amplifier.",
    "Direct Sound vs. Early Reflections": "Direct sound is the initial wave traveling straight from source to ear; early reflections are the first wave reflections bouncing off nearby room surfaces before full decay.",
    "Ducker / Sidechaining": "A dynamic technique where the level of one audio signal automatically lowers ('ducks') the volume of another signal whenever it plays (commonly used to duck bass behind kick drums).",
    "Dynamic EQ": "An equalizer whose gain cuts or boosts respond dynamically to incoming volume levels, functioning like a hybrid between a static parametric EQ and a multi-band compressor.",
    "Environment": "An advanced MIDI routing window in Logic Pro that visually represents the software's underlying MIDI architecture and signal routing options.",
    "Exciter / Harmonic Enhancer": "A plugin effect that generates high-frequency subtle harmonic distortion to add sparkle, air, and clarity to muffled audio tracks without boosting raw volume.",
    "Filter Cutoff": "The frequency threshold at which a filter begins attenuating (cutting) audio frequencies above or below it.",
    "Flam": "A drumming technique (or MIDI offset) where a secondary light stroke (grace note) is played micro-seconds before the primary snare or drum strike to create a thicker hit.",
    "FM Synthesis (Frequency Modulation)": "A synthesis technique where the frequency of one audio oscillator (the Carrier) is rapidly modulated by another oscillator (the Modulator) to create rich, bell-like, or metallic timbres.",
    "Formant": "Fundamental acoustic resonance frequencies of the vocal tract that give vowels and human voices their specific tonal character, independent of pitch.",
    "Gain Reduction": "The total amount of decibels (dB) turned down by dynamic processing gear (compressors, limiters, gates) in response to input signal spikes.",
    "Gated Reverb": "A production technique where a long, highly diffused reverb tail is abruptly cut off by a noise gate, creating a massive 1980s-style snare or drum burst effect.",
    "Ghost Note": "A soft, subtle drum stroke played at low velocity (often on the snare or hi-hat) between main beats to add bounce, groove, and human pocket to a rhythm pattern.",
    "Glitch / Stutter Effect": "Micro-editing audio or using specialized buffer plugins to slice a sound into rapid sub-frame repetitions (1/32, 1/64 notes) to create robotic, high-energy transition effects.",

    "Haas Effect (Precedence Effect)": "A psychoacoustic phenomenon where if two identical sounds play within 1 to 35 ms of each other, the ear perceives them as a single fused sound coming from the direction of the earlier wave.",

    "Loudness (LUFS)": "Loudness Units relative to Full Scale; the international standard measurement for perceived loudness integrated over time, used by streaming platforms (e.g., Spotify, Apple Music).",

    "MID/SIDE (M/S) Processing": "A technique that splits a stereo audio signal into its center channel (Mid) and side information (Sides) for independent EQ, compression, or spatial editing.",
    "MIDI Draw": "A feature inside Logic Pro editors that lets you view and edit MIDI continuous controller (CC) data like pitch bend, volume, and expression as vector curves.",

    "Multi-Band Compression": "Dividing an audio signal into distinct frequency bands (e.g., Low, Mid, High) via crossovers so each band can be compressed independently with unique ratios and timings.",
    "Nyquist-Shannon Theorem": "The rule stating that to accurately capture an analog frequency digitally, the digital sample rate must be at least double the highest frequency recorded.",
    "Parallel Compression (New York Compression)": "Blending an untreated dry signal track with a duplicate track that has undergone heavy, aggressive compression to achieve punch and body without losing original dynamics.",
    "Parallel Processing": "Splitting an audio signal into two tracks: keeping one original 'clean' track and heavily processing the duplicate track, then blending them together.",
    "Parametric EQ": "An equalizer that gives full control over three main parameters per band: Frequency center, Gain level, and Bandwidth (Q factor).",
    "Phantom Power (+48V)": "A 48-volt DC electrical current sent through an XLR cable from an audio interface or preamp to power condenser microphones and active DI boxes.",
    "Phase Alignment": "Adjusting the time alignment of multiple microphone signals recording the same source (e.g., snare top and bottom mics) so their wave peaks line up, preventing low-end cancellation.",
    "Phaser / Flanger": "Modulation effects that split audio and mix it with a micro-delayed copy while modulating phase filter notches (Phaser) or comb-filter delay times (Flanger) to create a sweeping jet-engine effect.",
    "Pink Noise": "A sound wave pattern containing equal energy per octave across the frequency spectrum, matching human hearing perception closely.",
    "Plate Reverb": "An artificial reverb produced by vibrating a metal plate via a transducer; produces a dense, bright, immediate reverb sound ideal for vocals and drums.",
    "Pluck": "A synth patch characterized by a very fast attack and immediate decay envelope, mimicking string or percussive plucked sounds.",

    "Preamp (Preamplifier)": "An electronic circuit designed to boost weak micro-volt signals from microphones or instruments up to standard line-level audio for recording.",
    "Pulse Width Modulation (PWM)": "Modulating the duty cycle ratio of a square wave oscillator back and forth, altering harmonic overtones to generate rich, chorus-like moving textures.",
    "Quick Sampler": "A single-audio-file sampler in Logic Pro that automatically trims, chops, pitches, and maps loaded samples across a keyboard.",
    "Rimshot": "A percussion hit produced when an acoustic drumstick hits both the head and the metal rim of a snare drum simultaneously, producing an explosive, high-pitched accent.",
    "Ring Modulation": "An effect that multiplies two audio signals together, outputting non-harmonic sum and difference frequencies that sound metallic, robotic, or dissonant.",
    "RMS (Root Mean Square)": "A mathematical measurement representing the average continuous volume power of an audio signal over time rather than short sudden peaks.",
    "Sample Chopping": "The technique of slicing a continuous audio recording or drum loop into isolated segments mapped across pads or keyboard keys to re-sequence a new performance.",
    "Sample Layering": "Stacking multiple drum samples (e.g., a low sub kick + a punchy mid kick + a transient top click) on a single beat to build a complete, radio-ready drum tone.",
    "Sawtooth Wave": "A geometric waveform containing both even and odd integer harmonics; produces a bright, buzz-like tone ideal for synth leads, brass, and reese basses.",
    "Serial Compression": "Routing audio sequentially through two or more subtle compressors in a chain rather than relying on a single compressor working hard.",

    "Signal-to-Noise Ratio (SNR)": "The measure of signal level strength relative to the background system noise floor generated by hardware electronics.",

    "Step Input Keyboard": "A window tool that allows MIDI notes to be entered one note at a time while playback is stopped.",

    "Transient Shaper / Designer": "A dynamic processor that independently boosts or softens the initial attack punch or trailing sustain tail of drum hits without relying on fixed volume thresholds.",
    "Tube Saturation": "Harmonics generated by overloading vacuum tubes, adding warm, even-order harmonic overtones that make vocals and mid-range instruments sound lush and present.",
    "VCA Compression": "A compressor style based on Voltage-Controlled Amplifier circuits (like the SSL Bus Comp); renowned for fast response, aggressive punch, and glue on drum busses.",

    "Waveform Shapes (Square/Pulse)": "A geometric wave containing only odd harmonics, yielding a hollow, woody, reedy, or retro 8-bit audio texture.",
    "Waveshaping Distortion": "A synthesis and saturation method that maps incoming waveform amplitudes through a non-linear transfer curve, warping waveform shapes to create harsh distortion.",
    "Wavetable Synthesis": "A digital synthesis technique that uses two-dimensional morphing stacks of single-cycle sampled waveforms, interpolating between them dynamically over time.",
    "White Noise": "A sound signal that contains equal energy at every single frequency across the human hearing spectrum simultaneously.",
    "Zero-Crossing": "The precise point in an audio waveform timeline where the signal amplitude passes through zero volts, marking ideal edit locations to eliminate pops and clicks."
  };

  for (const [term, def] of Object.entries(LOGIC_GLOSSARY)) {
    GLOSSARY_INDEX.set(term.toLowerCase(), { term, def });
  }
  for (const [alias, canonical] of Object.entries(GLOSSARY_ALIASES)) {
    if (LOGIC_GLOSSARY[canonical]) {
      GLOSSARY_INDEX.set(alias.toLowerCase(), { term: canonical, def: LOGIC_GLOSSARY[canonical] });
    }
  }

  function resolveGlossaryTerm(rawText) {
    if (!rawText) return null;
    let clean = rawText.trim().replace(/^[^a-zA-Z0-9+#]+|[^a-zA-Z0-9+#]+$/g, '').toLowerCase();
    if (GLOSSARY_INDEX.has(clean)) {
      return GLOSSARY_INDEX.get(clean);
    }
    if (clean.endsWith('ing') && GLOSSARY_INDEX.has(clean.slice(0, -3))) {
      return GLOSSARY_INDEX.get(clean.slice(0, -3));
    }
    if (clean.endsWith('es') && GLOSSARY_INDEX.has(clean.slice(0, -2))) {
      return GLOSSARY_INDEX.get(clean.slice(0, -2));
    }
    if (clean.endsWith('s') && GLOSSARY_INDEX.has(clean.slice(0, -1))) {
      return GLOSSARY_INDEX.get(clean.slice(0, -1));
    }
    return null;
  }

  function annotateGlossaryTermsIn(container, doc) {
    if (!container || !doc) return;
    const keys = Object.keys(LOGIC_GLOSSARY).sort((a, b) => b.length - a.length);
    const escaped = keys.map(k => k.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&')).join('|');
    const regex = new RegExp(`\\b(${escaped})(?:s|es|ing|ed)?\\b`, 'gi');

    const textNodes = [];
    const walk = (node) => {
      if (!node) return;
      if (node.nodeType === 3) {
        if (node.nodeValue && node.nodeValue.trim().length > 0 && regex.test(node.nodeValue)) {
          regex.lastIndex = 0;
          textNodes.push(node);
        }
        return;
      }
      if (node.nodeType === 1) {
        const tag = node.tagName.toUpperCase();
        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'IFRAME') {
          return;
        }
        if (node.classList && (node.classList.contains('logic-term') || node.classList.contains('logic-glossary-tooltip') || node.classList.contains('drum-drag-handle'))) {
          return;
        }
        for (let child = node.firstChild; child; child = child.nextSibling) {
          walk(child);
        }
      }
    };

    walk(container);

    for (const node of textNodes) {
      const parent = node.parentNode;
      if (!parent) continue;
      const text = node.nodeValue;
      regex.lastIndex = 0;

      const frag = doc.createDocumentFragment();
      let lastIndex = 0;
      let match;
      while ((match = regex.exec(text)) !== null) {
        const matchStart = match.index;
        const matchEnd = regex.lastIndex;
        if (matchStart > lastIndex) {
          frag.appendChild(doc.createTextNode(text.substring(lastIndex, matchStart)));
        }

        const matchedText = match[0];
        const canonical = resolveGlossaryTerm(matchedText) || resolveGlossaryTerm(match[1]);
        const span = doc.createElement('span');
        span.className = 'logic-term';
        span.setAttribute('data-term', canonical ? canonical.term : matchedText);
        span.textContent = matchedText;
        frag.appendChild(span);

        lastIndex = matchEnd;
      }

      if (lastIndex < text.length) {
        frag.appendChild(doc.createTextNode(text.substring(lastIndex)));
      }

      parent.replaceChild(frag, node);
    }
  }

  function initGlossary(doc, win) {
    if (!doc || !win) return;
    if (doc.__logicGlossaryInitialized) return;
    doc.__logicGlossaryInitialized = true;

    // Create Tooltip DOM Element
    const tooltip = doc.createElement('div');
    tooltip.className = 'logic-glossary-tooltip';
    tooltip.id = 'logicGlossaryTooltip';
    tooltip.innerHTML = `
      <div class="tooltip-header">
        <span class="tooltip-title" id="glossaryTooltipTitle"></span>
        <span class="tooltip-badge">LOGIC PRO 11</span>
      </div>
      <div class="tooltip-body" id="glossaryTooltipBody"></div>
      <div class="tooltip-footer">Music Tech Dictionary • Lane Tech HS</div>
    `;
    doc.body.appendChild(tooltip);

    const titleEl = tooltip.querySelector('#glossaryTooltipTitle');
    const bodyEl = tooltip.querySelector('#glossaryTooltipBody');

    let hoverTimer = null;
    let activeHoverElement = null;
    let currentTrigger = null; // 'hover' or 'selection'

    function showTooltip(term, def, x, y, trigger) {
      currentTrigger = trigger;
      titleEl.textContent = term;
      bodyEl.textContent = def;

      tooltip.style.display = 'block';
      tooltip.classList.add('visible');

      const tipRect = tooltip.getBoundingClientRect();
      const tipWidth = tipRect.width || 280;
      const tipHeight = tipRect.height || 85;
      const winW = win.innerWidth || doc.documentElement.clientWidth;
      const winH = win.innerHeight || doc.documentElement.clientHeight;

      let top = y - tipHeight - 12;
      let left = x - (tipWidth / 2);

      if (top < 10) {
        top = y + 20;
      }
      if (left < 10) left = 10;
      if (left + tipWidth > winW - 10) {
        left = winW - tipWidth - 10;
      }
      if (top + tipHeight > winH - 10) {
        top = winH - tipHeight - 10;
      }

      tooltip.style.left = `${Math.round(left)}px`;
      tooltip.style.top = `${Math.round(top)}px`;
    }

    function showTooltipAtRange(term, def, rect) {
      currentTrigger = 'selection';
      titleEl.textContent = term;
      bodyEl.textContent = def;

      tooltip.style.display = 'block';
      tooltip.classList.add('visible');

      const tipRect = tooltip.getBoundingClientRect();
      const tipWidth = tipRect.width || 280;
      const tipHeight = tipRect.height || 85;
      const winW = win.innerWidth || doc.documentElement.clientWidth;
      const winH = win.innerHeight || doc.documentElement.clientHeight;

      let top = rect.top - tipHeight - 10;
      let left = rect.left + (rect.width / 2) - (tipWidth / 2);

      if (top < 10) {
        top = rect.bottom + 10;
      }
      if (left < 10) left = 10;
      if (left + tipWidth > winW - 10) {
        left = winW - tipWidth - 10;
      }
      if (top + tipHeight > winH - 10) {
        top = winH - tipHeight - 10;
      }

      tooltip.style.left = `${Math.round(left)}px`;
      tooltip.style.top = `${Math.round(top)}px`;
    }

    function hideTooltip(trigger) {
      if (trigger && currentTrigger && currentTrigger !== trigger) {
        return;
      }
      tooltip.classList.remove('visible');
      tooltip.style.display = 'none';
      currentTrigger = null;
    }

    // 2. TEXT SELECTION LISTENER (selectionchange / mouseup)
    function handleSelectionCheck() {
      const selection = win.getSelection();
      if (!selection || selection.isCollapsed) {
        if (currentTrigger === 'selection') {
          hideTooltip('selection');
        }
        return;
      }

      const text = selection.toString().trim();
      if (!text || text.length > 50) {
        if (currentTrigger === 'selection') {
          hideTooltip('selection');
        }
        return;
      }

      const matched = resolveGlossaryTerm(text);
      if (matched) {
        try {
          const range = selection.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          if (rect && (rect.width > 0 || rect.height > 0)) {
            showTooltipAtRange(matched.term, matched.def, rect);
          }
        } catch (err) {}
      } else if (currentTrigger === 'selection') {
        hideTooltip('selection');
      }
    }

    doc.addEventListener('mouseup', handleSelectionCheck);
    let selTimer = null;
    doc.addEventListener('selectionchange', () => {
      clearTimeout(selTimer);
      selTimer = setTimeout(handleSelectionCheck, 120);
    });

    doc.addEventListener('mousedown', (e) => {
      if (currentTrigger === 'selection' && !e.target.closest('#logicGlossaryTooltip')) {
        setTimeout(handleSelectionCheck, 60);
      }
    });

    win.annotateGlossaryTerms = (container) => {
      annotateGlossaryTermsIn(container, doc);
    };
  }

  // Initialize for main launcher window
  initGlossary(document, window);
</script>
