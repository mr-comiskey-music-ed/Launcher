    { title: "Project #1: Partner Project & Logic Review", id: "118H-sHLE_Ezjn_rooh52rVnDZ6Kf_f7h0Wlioj24Wx4" }
  ];

  function populateSelect(selectElem, docs, defaultText) {
    selectElem.innerHTML = `<option value="">${defaultText}</option>`;
    docs.forEach(doc => {
      const opt = document.createElement('option');
      opt.value = doc.id;
      opt.textContent = doc.title;
      selectElem.appendChild(opt);
    });
  }

  // Fetch Dynamic Folder Contents
  async function loadDriveDocs() {
    try {
      const res = await fetch('/api/get-docs');
      if (!res.ok) throw new Error('API fetch error');
      const data = await res.json();
      
      populateSelect(seSelect, data.se || FALLBACK_SE, '-- Choose Sound Engineering Project --');
      populateSelect(ampSelect, data.amp || FALLBACK_AMP, '-- Choose AMP Project --');
    } catch (e) {
      console.warn('Dynamic Drive fetch failed, using fallback lists.', e);
      populateSelect(seSelect, FALLBACK_SE, '-- Choose Sound Engineering Project --');
      populateSelect(ampSelect, FALLBACK_AMP, '-- Choose AMP Project --');
    }
  }

  loadDriveDocs();

  // Clear mutual inputs
  seSelect.addEventListener('change', () => { if(seSelect.value) { ampSelect.value = ''; docInput.value = ''; } });
  ampSelect.addEventListener('change', () => { if(ampSelect.value) { seSelect.value = ''; docInput.value = ''; } });
  docInput.addEventListener('input', () => { if(docInput.value) { seSelect.value = ''; ampSelect.value = ''; } });

      { key: "R", desc: "Record" },
      { key: "⌘ + ⬅︎ / ➡︎", desc: "Zoom Horizontal Out / In" },
      { key: "⌘ + ⬆︎ / ⬇︎", desc: "Zoom Vertical Out / In" },

      { key: "⌘ + Z / ⌘ + Shift + Z", desc: "Undo / Redo" },
      { key: "⌘ + X / C / V", desc: "Cut / Copy / Paste" },
      { key: "⌘ + A", desc: "Select All" },
      { key: "⌘ + J", desc: "Join Regions" },
      { key: "⌘ + T", desc: "Split Region at Playhead" },

      { key: "⌘ + D", desc: "Duplicate Track" },

      { key: "⌘ + B", desc: "Bounce Project" },
      { key: "⌘ + S", desc: "Save Project" }

    let docId = selectedDocId.replace(/[\/%\s]+$/, '');
    const match = docId.match(/\/d\/(e\/[a-zA-Z0-9-_]+|[a-zA-Z0-9-_]+)/);
    if (match && match[1]) docId = match[1];

    const iframeSrc = docId.startsWith('e/')
      ? `https://docs.google.com/document/d/${docId}/pub?embedded=true`
      : `https://docs.google.com/document/d/${docId}/preview`;

        }

        .toolbar button.shortcuts-btn { background: #2563eb; border-color: #3b82f6; }
        .toolbar button.ai-btn { background: #1e3a8a; border-color: #3b82f6; color: #93c5fd; }
        .toolbar button.patterns-btn { background: #047857; border-color: #059669; color: #a7f3d0; }
        .toolbar button.active-btn { background: #16a34a !important; border-color: #22c55e !important; }

        .viewport-area { flex: 1; width: 100%; height: 100%; overflow: auto; position: relative; background: #ffffff; }
        .doc-wrapper { width: 100%; height: 100%; transform-origin: top left; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .no-pointer { pointer-events: none !important; }

        .loupe {
          display: none; position: absolute; width: 200px; height: 200px; border-radius: 50%;
          border: 3px solid #38bdf8; box-shadow: 0 6px 24px rgba(0,0,0,0.6); pointer-events: none;

        }
        .loupe-iframe { position: absolute; border: none; transform-origin: top left; pointer-events: none; }

        }
        .modal-content {
          background: #242426; color: #f3f4f6; width: 100%; max-width: 580px; max-height: 90%;

        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #18181a; border-bottom: 1px solid #3a3a3c; }
        .modal-header h3 { margin: 0; font-size: 14px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Drum Patterns Styles */
        .drum-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

          background: #18181a; border: 1px solid #3a3a3c; color: #f3f4f6; padding: 6px 10px; border-radius: 4px; font-size: 12px; outline: none;

        .drum-tag { background: #242426; border: 1px solid #3a3a3c; color: #9ca3af; font-size: 10px; padding: 2px 6px; border-radius: 10px; }
        .sequencer-table { display: flex; flex-direction: column; gap: 3px; background: #121212; padding: 6px; border-radius: 4px; border: 1px solid #2a2a2c; }
        .seq-row { display: flex; align-items: center; gap: 4px; }

        .drum-fav-btn {
          background: transparent; color: #facc15; border: 1px solid #3a3a3c; padding: 3px 6px; border-radius: 4px; font-size: 13px; cursor: pointer;

        .drum-fav-btn:hover { background: #242426; border-color: #facc15; }
        .seq-step.playing-step { border: 1px solid #38bdf8 !important; box-shadow: 0 0 6px #38bdf8; transform: scale(1.1); }

        .tab-nav { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid #3a3a3c; padding-bottom: 8px; flex-wrap: wrap; }
        .tab-btn { background: #18181a; color: #9ca3af; border: 1px solid #3a3a3c; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .shortcut-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #3a3a3c; }
        .shortcut-key { font-family: monospace; background: #18181a; padding: 2px 6px; border-radius: 4px; color: #38bdf8; }
        .bpm-display { font-size: 32px; font-weight: bold; color: #38bdf8; text-align: center; margin: 10px 0; font-family: monospace; }

      loupe.appendChild(loupeIframe);
      viewportArea.appendChild(loupe);

      // AI Chat Drawer element
      const chatDrawer = pipWindow.document.createElement('div');
      chatDrawer.className = 'chat-drawer';
      chatDrawer.id = 'chatDrawer';
      chatDrawer.innerHTML = `
        <div class="chat-header">
          <span>🤖 Mr. Comiskey's Music Tech AI</span>
          <button class="chat-close" id="closeChatBtn">&times;</button>

        <div class="chat-input-area">

          <button id="chatSendBtn">Send</button>
        </div>
      `;
      viewportArea.appendChild(chatDrawer);

      pipWindow.document.body.appendChild(viewportArea);

      // Chat Drawer Logic
      const openAiChatBtn = pipWindow.document.getElementById('openAiChatBtn');
      const closeChatBtn = pipWindow.document.getElementById('closeChatBtn');
      const chatMessages = pipWindow.document.getElementById('chatMessages');
      const chatInput = pipWindow.document.getElementById('chatInput');
      const chatSendBtn = pipWindow.document.getElementById('chatSendBtn');

      openAiChatBtn.addEventListener('click', () => {
        const isVisible = chatDrawer.style.display === 'flex';
        chatDrawer.style.display = isVisible ? 'none' : 'flex';
        if (!isVisible) chatInput.focus();
      });

      closeChatBtn.addEventListener('click', () => { chatDrawer.style.display = 'none'; });

      async function sendChatQuery() {
        const promptText = chatInput.value.trim();
        if (!promptText) return;

        const userMsg = pipWindow.document.createElement('div');
        userMsg.className = 'chat-msg user';
        userMsg.textContent = promptText;
        chatMessages.appendChild(userMsg);
        chatInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        const thinkingMsg = pipWindow.document.createElement('div');
        thinkingMsg.className = 'chat-msg assistant';
        thinkingMsg.textContent = 'Thinking...';
        chatMessages.appendChild(thinkingMsg);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: promptText, currentDocId: docId })
          });
          const data = await res.json();
          if (data.reply) {
            thinkingMsg.textContent = data.reply;
          } else if (data.error) {
            thinkingMsg.textContent = 'Error: ' + data.error;
          } else {
            thinkingMsg.textContent = 'Sorry, I encountered an error answering that.';
          }
        } catch (e) {
          thinkingMsg.textContent = 'Connection error. Please check your network.';
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      chatSendBtn.addEventListener('click', sendChatQuery);
      chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatQuery(); });

      // Modal Overlay for Shortcuts, Mix Tips, BPM, and Patterns
      const modalOverlay = pipWindow.document.createElement('div');
      modalOverlay.className = 'modal-overlay';
      modalOverlay.id = 'modalOverlay';
      modalOverlay.innerHTML = `
        <div class="modal-content">
          <div class="modal-header">
            <h3 id="modalTitle">MODAL</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
          </div>
          <div class="modal-body" id="modalBody"></div>
        </div>
      `;
      pipWindow.document.body.appendChild(modalOverlay);

      const lightboxModal = pipWindow.document.createElement('div');
      lightboxModal.className = 'lightbox-modal';
      lightboxModal.id = 'lightboxModal';
      lightboxModal.innerHTML = `<img class="lightbox-content" id="lightboxImg" src="" alt="Zoomed view">`;
      pipWindow.document.body.appendChild(lightboxModal);
      lightboxModal.addEventListener('click', () => { lightboxModal.style.display = 'none'; });

      const modal = pipWindow.document.getElementById('modalOverlay');
      const modalTitle = pipWindow.document.getElementById('modalTitle');
      const modalBody = pipWindow.document.getElementById('modalBody');

      class DrumSynth {
        constructor(audioContext, outputNode) {
          this.context = audioContext;
          this.dry = outputNode || audioContext.destination;
          this.noiseBuffer = null;
        }

        getNoise() {
          if (this.noiseBuffer) return this.noiseBuffer;
          const bufferSize = this.context.sampleRate;
          const buffer = this.context.createBuffer(1, bufferSize, this.context.sampleRate);
          const output = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
          this.noiseBuffer = buffer;
          return this.noiseBuffer;
        }

        scheduleKick(t) {
          if (!this.context || !this.dry) return;
          const o = this.context.createOscillator(), i = this.context.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(155, t);
          o.frequency.exponentialRampToValueAtTime(47, t + .13);
          i.gain.setValueAtTime(1e-4, t);
          i.gain.exponentialRampToValueAtTime(.19, t + .004);
          i.gain.exponentialRampToValueAtTime(1e-4, t + .16);
          o.connect(i); i.connect(this.dry);
          o.start(t); o.stop(t + .18);
        }

        scheduleSnare(t) {
          const o = this.getNoise();
          if (!this.context || !o || !this.dry) return;
          const i = this.context.createBufferSource(), c = this.context.createBiquadFilter(), d = this.context.createGain();
          i.buffer = o; c.type = "highpass"; c.frequency.setValueAtTime(1400, t);
          d.gain.setValueAtTime(.13, t);
          d.gain.exponentialRampToValueAtTime(1e-4, t + .12);
          i.connect(c); c.connect(d); d.connect(this.dry);
          i.start(t); i.stop(t + .14);
        }

        scheduleHat(t) {
          const o = this.getNoise();
          if (!this.context || !o || !this.dry) return;
          const i = this.context.createBufferSource(), c = this.context.createBiquadFilter(), d = this.context.createGain();
          i.buffer = o; c.type = "highpass"; c.frequency.setValueAtTime(5600, t);
          d.gain.setValueAtTime(.04, t);
          d.gain.exponentialRampToValueAtTime(1e-4, t + .045);
          i.connect(c); c.connect(d); d.connect(this.dry);
          i.start(t); i.stop(t + .06);
        }

        scheduleOpenHat(t) {
          const o = this.getNoise();
          if (!this.context || !o || !this.dry) return;
          const i = this.context.createBufferSource(), c = this.context.createBiquadFilter(), d = this.context.createGain();
          i.buffer = o; c.type = "highpass"; c.frequency.setValueAtTime(5600, t);
          d.gain.setValueAtTime(.06, t);
          d.gain.exponentialRampToValueAtTime(1e-4, t + .35);
          i.connect(c); c.connect(d); d.connect(this.dry);
          i.start(t); i.stop(t + .38);
        }
      }

      let currentPlayingCardId = null;
      let currentPlaybackInterval = null;
      let currentAudioCtx = null;
      let currentSynth = null;

      const stopCurrentPlayback = () => {
        if (currentPlaybackInterval) {
          clearInterval(currentPlaybackInterval);
          currentPlaybackInterval = null;
        }
        if (currentAudioCtx && currentAudioCtx.state !== 'closed') {
          currentAudioCtx.close();
          currentAudioCtx = null;
        }
        currentSynth = null;
        if (currentPlayingCardId) {
          const btn = pipWindow.document.getElementById(`play-btn-${currentPlayingCardId}`);
          if (btn) {
            btn.textContent = "▶ Play";
            btn.classList.remove('playing');
          }
          const card = pipWindow.document.getElementById(`drum-card-${currentPlayingCardId}`);
          if (card) {
            card.querySelectorAll('.seq-step').forEach(s => s.classList.remove('playing-step'));
          }
          currentPlayingCardId = null;
        }
      };

      pipWindow.document.getElementById('closeModalBtn').addEventListener('click', () => {
        stopCurrentPlayback();
        modal.style.display = 'none';
      });

      // Patterns Modal Trigger with cachedPatterns & non-destructive search update
      let cachedPatterns = null;
      pipWindow.document.getElementById('openPatternsBtn').addEventListener('click', async () => {
        modalTitle.textContent = "🥁 DRUM PATTERN DATABASE";
        
        modalBody.innerHTML = `
          <div class="drum-controls">
            <input type="text" id="drumSearch" class="drum-search" placeholder="Search pattern name or style (e.g. electro, house)...">
            <select id="drumStyleFilter" class="drum-filter">
              <option value="all">All Styles & Genres</option>
            </select>
          </div>
          <div class="drum-grid" id="drumGridContainer">
            <div style="text-align:center; color:#9ca3af; padding:20px;">Loading drum patterns...</div>
          </div>
        `;
        modal.style.display = 'flex';

        if (!cachedPatterns) {
          try {
            const res = await fetch('/patterns.json');
            cachedPatterns = await res.json();
          } catch (e) {
            cachedPatterns = [];
          }
        }

        const searchInput = pipWindow.document.getElementById('drumSearch');
        const styleSelect = pipWindow.document.getElementById('drumStyleFilter');
        const gridContainer = pipWindow.document.getElementById('drumGridContainer');

        const getFavorites = () => {
          try {
            return JSON.parse(localStorage.getItem('floatdoc_favorite_patterns') || '[]');
          } catch(e) {
            return [];
          }
        };

        const toggleFavorite = (cardId) => {
          let favs = getFavorites();
          if (favs.includes(cardId)) {
            favs = favs.filter(id => id !== cardId);
          } else {
            favs.push(cardId);
          }
          try {
            localStorage.setItem('floatdoc_favorite_patterns', JSON.stringify(favs));
          } catch(e) {}
          updateGrid();
        };

        styleSelect.innerHTML = `<option value="all">All Styles & Genres</option><option value="favorites">⭐ Favorites Only</option>`;
        const allStyles = [...new Set(cachedPatterns.flatMap(p => p.meta.style))];
        allStyles.forEach(s => {
          const opt = pipWindow.document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          styleSelect.appendChild(opt);
        });

        const updateGrid = () => {
          stopCurrentPlayback();
          const filterText = searchInput.value.trim().toLowerCase();
          const styleFilter = styleSelect.value;
          const favs = getFavorites();

          const filtered = cachedPatterns.filter((p, idx) => {
            const cardId = p.id || `pat-${idx}`;
            const matchesSearch = !filterText || p.name.toLowerCase().includes(filterText) || p.meta.style.some(s => s.toLowerCase().includes(filterText));
            let matchesStyle = true;
            if (styleFilter === 'favorites') {
              matchesStyle = favs.includes(cardId);
            } else if (styleFilter !== 'all') {
              matchesStyle = p.meta.style.includes(styleFilter) || p.meta.feel === styleFilter || p.meta.family === styleFilter;
            }
            return matchesSearch && matchesStyle;
          });

          if (filtered.length === 0) {
            gridContainer.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:20px;">No drum patterns found matching your search.</div>`;
            return;
          }

          let gridHtml = '';
          filtered.forEach((pat, idx) => {
            const cardId = pat.id || `pat-${idx}`;
            const isFav = favs.includes(cardId);
            const totalSteps = (pat.stepsPerBeat || 4) * (pat.beats || 4) * (pat.bars || 1);
            const voices = pat.voices || {};
            const renderVoiceRow = (voiceKey, label, colorClass) => {
              const activeSteps = voices[voiceKey] || [];
              let stepsHtml = '';
              for(let i=0; i<totalSteps; i++) {
                const isActive = activeSteps.includes(i);
                const isDivider = (i === 4 || i === 8 || i === 12);
                const cls = `seq-step ${isActive ? colorClass : ''} ${isDivider ? 'beat-divider' : ''}`;
                stepsHtml += `<div class="${cls} step-index-${i}" title="Step ${i+1}"></div>`;
              }
              return `
                <div class="seq-row">
                  <div class="seq-label">${label}</div>
                  <div class="seq-steps">${stepsHtml}</div>
                </div>
              `;
            };

            gridHtml += `
              <div class="drum-card" id="drum-card-${cardId}">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <div class="drum-card-title" style="margin-bottom:0;">${pat.name}</div>
                  <div style="display:flex; gap:6px; align-items:center;">
                    <button class="drum-fav-btn" data-card-id="${cardId}" title="Toggle Favorite">${isFav ? '★' : '☆'}</button>
                    <button class="drum-play-btn" id="play-btn-${cardId}" data-card-id="${cardId}">▶ Play</button>
                  </div>
                </div>
                <div class="drum-tags">
                  ${pat.meta.style.map(st => `<span class="drum-tag">${st}</span>`).join('')}
                  <span class="drum-tag">Feel: ${pat.meta.feel}</span>
                  <span class="drum-tag">Section: ${pat.meta.section}</span>
                  <span class="drum-tag">Energy: ${pat.meta.energy}/5</span>
                </div>
                <div class="sequencer-table">
                  ${renderVoiceRow('hihatO', 'Hi-Hat O', 'active-hihatO')}
                  ${renderVoiceRow('hihatC', 'Hi-Hat C', 'active-hihatC')}
                  ${renderVoiceRow('snare', 'Snare', 'active-snare')}
                  ${renderVoiceRow('kick', 'Kick', 'active-kick')}
                </div>
              </div>
            `;
          });
          gridContainer.innerHTML = gridHtml;

          gridContainer.querySelectorAll('.drum-fav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const cardId = btn.getAttribute('data-card-id');
              toggleFavorite(cardId);
            });
          });

          gridContainer.querySelectorAll('.drum-play-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const cardId = btn.getAttribute('data-card-id');
              const pat = filtered.find(p => (p.id || `pat-${filtered.indexOf(p)}`) === cardId);
              if (!pat) return;

              if (currentPlayingCardId === cardId) {
                stopCurrentPlayback();
                return;
              }

              stopCurrentPlayback();
              currentPlayingCardId = cardId;
              btn.textContent = "⏹ Stop";
              btn.classList.add('playing');

              const AudioContextClass = pipWindow.AudioContext || pipWindow.webkitAudioContext;
              currentAudioCtx = new AudioContextClass();
              if (currentAudioCtx.state === 'suspended') {
                await currentAudioCtx.resume();
              }
              currentSynth = new DrumSynth(currentAudioCtx);

              const bpm = (pat.meta.bpmRange && pat.meta.bpmRange[0]) ? pat.meta.bpmRange[0] : 120;
              const stepTime = (60 / bpm) / 4;
              const totalSteps = (pat.stepsPerBeat || 4) * (pat.beats || 4) * (pat.bars || 1);
              const voices = pat.voices || {};

              let currentStep = 0;
              const cardEl = pipWindow.document.getElementById(`drum-card-${cardId}`);

              const scheduleStep = () => {
                if (!currentAudioCtx || currentAudioCtx.state === 'closed') return;
                const now = currentAudioCtx.currentTime;

                if ((voices.kick || []).includes(currentStep)) currentSynth.scheduleKick(now);
                if ((voices.snare || []).includes(currentStep)) currentSynth.scheduleSnare(now);
                if ((voices.hihatC || []).includes(currentStep)) currentSynth.scheduleHat(now);
                if ((voices.hihatO || []).includes(currentStep)) currentSynth.scheduleOpenHat(now);

                if (cardEl) {
                  cardEl.querySelectorAll('.seq-step').forEach(s => s.classList.remove('playing-step'));
                  cardEl.querySelectorAll(`.step-index-${currentStep}`).forEach(s => s.classList.add('playing-step'));
                }

                currentStep = (currentStep + 1) % totalSteps;
              };

              scheduleStep();
              currentPlaybackInterval = setInterval(scheduleStep, stepTime * 1000);
            });
          });
        };

        searchInput.addEventListener('input', updateGrid);
        styleSelect.addEventListener('change', updateGrid);
        updateGrid();
        searchInput.focus();
      });

      pipWindow.document.getElementById('openShortcutsBtn').addEventListener('click', () => {
        modalTitle.textContent = "🎹 LOGIC KEYBOARD SHORTCUTS";
        let html = '';
        SHORTCUTS_DATA.forEach(cat => {
          html += `<div style="color:#38bdf8; font-weight:bold; margin:10px 0 4px 0; border-bottom:1px solid #3a3a3c;">${cat.category}</div>`;
          cat.items.forEach(item => {
            html += `<div class="shortcut-row"><span>${item.desc}</span><span class="shortcut-key">${item.key}</span></div>`;
          });
        });
        modalBody.innerHTML = html;
        modal.style.display = 'flex';
      });

      pipWindow.document.getElementById('openMixTipsBtn').addEventListener('click', () => {
        modalTitle.textContent = "🎛 MIX TIPS & FREQUENCY CHEATSHEET";
        modalBody.innerHTML = `
          <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('eqTab')">EQ</button>
            <button class="tab-btn" onclick="switchTab('compTab')">Compression</button>
          </div>
          <div id="eqTab" class="tab-pane active">
            <div style="margin-top:4px; font-weight:bold; color:#38bdf8;">Reference Visual Charts (Click to Expand):</div>
            <div class="expandable-img-grid">
              <div class="expandable-card" onclick="openLightbox('/sweetwater_eq_chart.jpg')">
                <img src="/sweetwater_eq_chart.jpg" alt="Instrument Frequency Chart">
                <div class="expandable-caption">🔍 Instrument Frequency Ranges Chart (Click to expand)</div>
              </div>
              <div class="expandable-card" onclick="openLightbox('/descriptive_audio_terms.jpg')">
                <img src="/descriptive_audio_terms.jpg" alt="5 Ranges Descriptive Audio Terms">
                <div class="expandable-caption">🔍 5 Ranges Descriptive Audio Terms (Click to expand)</div>
              </div>
            </div>

            <div style="margin-top:16px; font-weight:bold; color:#38bdf8;">More Info:</div>
            <div class="video-container">
              <iframe src="https://www.youtube-nocookie.com/embed/7H3cHfV8rXI" title="EQ Masterclass Video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>

          <div id="compTab" class="tab-pane">
            <p><b>Compression & Bussing Rules:</b></p>
            <ul style="padding-left:18px; line-height:1.6; margin-bottom:14px;">
              <li><b>Slow Attack (>30ms):</b> Lets transients through (punchy drums & percussion).</li>
              <li><b>Fast Attack (<10ms):</b> Catches peaks & smooths out performances (tames vocals/bass).</li>
              <li><b>Auto/Sync Release:</b> Keeps compressor pumping smoothly with song tempo.</li>
              <li><b>Drum Bus Compression:</b> 2:1 or 4:1 ratio, 30ms attack, fast release for glue.</li>
            </ul>

            <div style="margin-top:16px; font-weight:bold; color:#38bdf8;">Simple Tutorial:</div>
            <div class="video-container">
              <iframe src="https://www.youtube-nocookie.com/embed/LGqDVhww-hs" title="Simple Compression Tutorial" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <div style="margin-top:16px; font-weight:bold; color:#38bdf8;">In Depth Tutorial:</div>
            <div class="video-container">
              <iframe src="https://www.youtube-nocookie.com/embed/booRjPgtIS4" title="In Depth Compression Tutorial" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
          </div>
        `;

        pipWindow.switchTab = (tabId) => {
          pipWindow.document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          pipWindow.document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
          event.target.classList.add('active');
          pipWindow.document.getElementById(tabId).classList.add('active');
        };

        pipWindow.openLightbox = (imgSrc) => {
          const lb = pipWindow.document.getElementById('lightboxModal');
          const lbImg = pipWindow.document.getElementById('lightboxImg');
          lbImg.src = imgSrc;
          lb.style.display = 'flex';
        };

        modal.style.display = 'flex';
      });

      pipWindow.document.getElementById('openBpmBtn').addEventListener('click', () => {
        modalTitle.textContent = "⏱ TAP TEMPO & DELAY MATH";
        modalBody.innerHTML = `
          <div class="bpm-display" id="bpmVal">120 BPM</div>
          <button class="tap-btn" id="tapPad">TAP TEMPO HERE</button>
          <div style="margin-top:16px;">
            <b>Delay Sync Values:</b>
            <div id="delayTable" style="margin-top:8px; line-height:1.6;"></div>
          </div>
        `;

        let taps = [];
        const bpmVal = pipWindow.document.getElementById('bpmVal');
        const delayTable = pipWindow.document.getElementById('delayTable');

        const updateDelays = (bpm) => {
          const quarterMs = Math.round((60000 / bpm));
          const eighthMs = Math.round(quarterMs / 2);
          const sixteenthMs = Math.round(quarterMs / 4);
          const dottedEighthMs = Math.round(eighthMs * 1.5);

          delayTable.innerHTML = `
            <div class="shortcut-row"><span>1/4 Note Delay:</span><span class="shortcut-key">${quarterMs} ms</span></div>
            <div class="shortcut-row"><span>1/8 Note Delay:</span><span class="shortcut-key">${eighthMs} ms</span></div>
            <div class="shortcut-row"><span>1/8 Dotted Delay:</span><span class="shortcut-key">${dottedEighthMs} ms</span></div>
            <div class="shortcut-row"><span>1/16 Note Delay:</span><span class="shortcut-key">${sixteenthMs} ms</span></div>
          `;
        };

        updateDelays(120);

        pipWindow.document.getElementById('tapPad').addEventListener('click', () => {
          const now = Date.now();
          taps.push(now);
          if (taps.length > 4) taps.shift();
          if (taps.length > 1) {
            const diffs = [];
            for (let i = 1; i < taps.length; i++) diffs.push(taps[i] - taps[i-1]);
            const avgMs = diffs.reduce((a, b) => a + b) / diffs.length;
            const bpm = Math.round(60000 / avgMs);
            bpmVal.textContent = `${bpm} BPM`;
            updateDelays(bpm);
          }
        });

        modal.style.display = 'flex';
      });

      let currentZoom = 1.0;
      const setZoom = (newZoom) => {
        currentZoom = Math.round(Math.max(0.5, Math.min(2.0, newZoom)) * 10) / 10;
        docWrapper.style.transform = `scale(${currentZoom})`;
        docWrapper.style.width = `${100 / currentZoom}%`;
        docWrapper.style.height = `${100 / currentZoom}%`;
        pipWindow.document.getElementById('zoomVal').textContent = `${Math.round(currentZoom * 100)}%`;
      };

      pipWindow.document.getElementById('zoomIn').addEventListener('click', () => setZoom(currentZoom + 0.1));
      pipWindow.document.getElementById('zoomOut').addEventListener('click', () => setZoom(currentZoom - 0.1));
      pipWindow.document.getElementById('zoomReset').addEventListener('click', () => setZoom(1.0));

      let loupeActive = false;
      const loupeBtn = pipWindow.document.getElementById('loupeToggleBtn');

      loupeBtn.addEventListener('click', () => {
        loupeActive = !loupeActive;
        loupeBtn.classList.toggle('active-btn', loupeActive);
        loupe.style.display = loupeActive ? 'block' : 'none';
        iframe.classList.toggle('no-pointer', loupeActive);

        if (loupeActive) {
          const rect = viewportArea.getBoundingClientRect();
          loupeIframe.style.width = `${rect.width}px`;
          loupeIframe.style.height = `${rect.height}px`;
        }
      });

      viewportArea.addEventListener('mousemove', (e) => {
        if (!loupeActive) return;
        const rect = viewportArea.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const zoomFactor = 2.0;
        const radius = 100;

        loupe.style.left = `${mouseX - radius}px`;
        loupe.style.top = `${mouseY - radius}px`;

        loupeIframe.style.transform = `scale(${zoomFactor})`;
        loupeIframe.style.left = `${radius - (mouseX * zoomFactor)}px`;
        loupeIframe.style.top = `${radius - (mouseY * zoomFactor)}px`;
      });

    } catch (err) {
      alert('Error opening window: ' + err.message);
    }
  }

  document.getElementById('floatBtn').addEventListener('click', () => {
    let selectedDocId = seSelect.value || ampSelect.value || docInput.value.trim();
    if (!selectedDocId) {
      alert('Please select a project from a dropdown or paste a link.');
      return;
    }
    launchFloater(selectedDocId);
  });

  // URL Deep-Linking (e.g. float.mrcomiskey.com/?doc=DOC_ID)
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const docParam = params.get('doc');
    if (docParam) {
      setTimeout(() => {
        launchFloater(docParam);
      }, 500);
    }
  });
</script>
